name: Deploy Worker

# Deploys the Cloudflare Worker whenever worker/ changes on main, filling in the KV namespace ID
# from a repository secret so it isn't committed. Worker secrets (access codes, proxy) live in
# Cloudflare and are kept across deploys.

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the Worker tests
        run: node --test

      - name: Fill in the storage ID
        env:
          KV_NAMESPACE_ID: ${{ secrets.KV_NAMESPACE_ID }}
        run: sed -i "s/REPLACE_WITH_KV_NAMESPACE_ID/${KV_NAMESPACE_ID}/" wrangler.toml

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
